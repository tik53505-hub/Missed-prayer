<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>قضاء الصلوات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
    color: #e8e8e8;
    padding: 12px;
    padding-bottom: 100px;
    min-height: 100vh;
  }

  .header-card {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    border: 2px solid #d4af37;
    color: white;
    padding: 26px 18px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 14px;
  }

  .header-title {
    font-size: 22px;
    font-weight: bold;
    color: #d4af37;
    margin-bottom: 14px;
  }

  .divider { text-align: center; color: #d4af37; font-size: 14px; margin: 10px 0; opacity: 0.7; }
  .dua { font-size: 16px; font-weight: 600; color: #d4af37; line-height: 1.9; }

  .full-day-btn {
    width: 100%;
    background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    border: 2px solid #d4af37;
    color: #d4af37;
    padding: 18px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
    transition: transform 0.1s;
  }
  .full-day-btn:active { transform: scale(0.98); }

  .prayer-card {
    background: #141414;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    border-right: 4px solid #d4af37;
    border-top: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    border-left: 1px solid #2a2a2a;
  }

  .prayer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }

  .prayer-name {
    font-size: 17px;
    font-weight: bold;
    color: #d4af37;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .time-info {
    text-align: left;
    font-size: 11px;
    color: #fbbf24;
    line-height: 1.6;
    font-weight: 600;
  }

  .remaining {
    font-size: 15px;
    margin: 8px 0;
    color: #b8b8b8;
  }

  .remaining .num {
    font-size: 26px;
    font-weight: bold;
    color: #f87171;
  }

  .prayer-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .action-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-pray {
    background: linear-gradient(135deg, #b8860b, #d4af37);
    color: #0a0a0a;
  }

  /* كلاس التحول للأخضر */
  .btn-pray.success {
    background: linear-gradient(135deg, #16a34a, #22c55e) !important;
    color: white !important;
    transform: scale(0.98);
  }

  .btn-undo {
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #444;
    flex: 0.4;
  }

  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #d4af37;
    color: #0a0a0a;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 400;
    max-width: 90%;
    text-align: center;
  }

  .toast.show { opacity: 1; }

  .info-note {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 16px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="header-card">
  <div class="header-title">✨ قضاء الصلوات ✨</div>
  <div class="divider">﷽</div>
  <div class="dua">
    اللهم صل على محمد وآل محمد<br>
    اللهم اغفر لي ذنوبي فإنه لا يغفر الذنوب إلا أنت
  </div>
</div>

<button class="full-day-btn" onclick="prayFullDay(this)">
  ✓ قضيت يوماً كاملاً (فجر + ظهر وعصر + مغرب وعشاء)
</button>

<div id="prayersContainer"></div>

<div class="info-note">
  اضغط على "صليت قضاءً" لتسجيل صلاة قضيتها في أي وقت<br>
  سيتحول الزر للأخضر للتأكيد، ثم يعود لتتمكن من تسجيل صلاة أخرى.
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ البيانات ═══════════ */
const DEFAULT_COUNT = 3653;

const prayers = [
  { id: 'fajr',         name: 'صلاة الصبح',           icon: '🌅', count: 1 },
  { id: 'dhuhr_asr',    name: 'صلاة الظهر والعصر',    icon: '☀️', count: 2 },
  { id: 'maghrib_isha', name: 'صلاة المغرب والعشاء',  icon: '🌆', count: 2 }
];

// قراءة البيانات المحفوظة
let data = {};
try { data = JSON.parse(localStorage.getItem('salahData_final')) || {}; } catch(e) { data = {}; }
prayers.forEach(p => { if (typeof data[p.id] !== 'number') data[p.id] = DEFAULT_COUNT; });

/* ═══════════ مواقيت بغداد للعرض فقط ═══════════ */
function getPrayerTimes() {
  const month = new Date().getMonth() + 1;
  const monthlyTimes = {
    1:  { fajr: '05:45', dhuhr: '12:15', asr: '15:00', maghrib: '17:30', isha: '18:50' },
    2:  { fajr: '05:30', dhuhr: '12:20', asr: '15:20', maghrib: '17:50', isha: '19:10' },
    3:  { fajr: '05:00', dhuhr: '12:15', asr: '15:30', maghrib: '18:10', isha: '19:30' },
    4:  { fajr: '04:30', dhuhr: '12:05', asr: '15:35', maghrib: '18:30', isha: '19:50' },
    5:  { fajr: '04:00', dhuhr: '12:00', asr: '15:40', maghrib: '18:55', isha: '20:15' },
    6:  { fajr: '03:40', dhuhr: '12:05', asr: '15:55', maghrib: '19:15', isha: '20:35' },
    7:  { fajr: '03:45', dhuhr: '12:10', asr: '16:00', maghrib: '19:10', isha: '20:30' },
    8:  { fajr: '04:05', dhuhr: '12:05', asr: '15:50', maghrib: '18:50', isha: '20:10' },
    9:  { fajr: '04:25', dhuhr: '11:55', asr: '15:30', maghrib: '18:20', isha: '19:40' },
    10: { fajr: '04:45', dhuhr: '11:50', asr: '15:15', maghrib: '17:55', isha: '19:15' },
    11: { fajr: '05:10', dhuhr: '11:55', asr: '15:05', maghrib: '17:35', isha: '18:55' },
    12: { fajr: '05:35', dhuhr: '12:05', asr: '15:00', maghrib: '17:20', isha: '18:40' }
  };
  return monthlyTimes[month] || monthlyTimes[10];
}

/* ═══════════ العرض ═══════════ */
function render() {
  const container = document.getElementById('prayersContainer');
  if (!container) return;
  
  const times = getPrayerTimes();
  let html = '';

  prayers.forEach(p => {
    let timeDisplay = '';
    if (p.id === 'fajr') {
      timeDisplay = times.fajr;
    } else if (p.id === 'dhuhr_asr') {
      timeDisplay = 'الظهر: ' + times.dhuhr + ' | العصر: ' + times.asr;
    } else if (p.id === 'maghrib_isha') {
      timeDisplay = 'المغرب: ' + times.maghrib + ' | العشاء: ' + times.isha;
    }

    const btnText = '✓ صليت قضاءً ' + (p.count > 1 ? '(يوم)' : '');
    
    html += '<div class="prayer-card">' +
      '<div class="prayer-header">' +
        '<div class="prayer-name">' + p.icon + ' ' + p.name + '</div>' +
        '<div class="time-info">' + timeDisplay + '</div>' +
      '</div>' +
      '<div class="remaining">المتبقي: <span class="num" id="count-' + p.id + '">' + 
        data[p.id].toLocaleString('ar-EG') + '</span> صلاة</div>' +
      '<div class="prayer-actions">' +
        '<button class="action-btn btn-pray" id="btn-' + p.id + '" onclick="pray(\'' + p.id + '\', this)">' + btnText + '</button>' +
        '<button class="action-btn btn-undo" onclick="undo(\'' + p.id + '\')" title="تراجع">↩</button>' +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

/* ═══════════ الإجراءات ═══════════ */
function pray(id, btn) {
  const p = prayers.find(x => x.id === id);
  if (data[id] >= p.count) {
    data[id] -= p.count;
    save();
    
    // تحديث الرقم فوراً في الشاشة
    document.getElementById('count-' + id).textContent = data[id].toLocaleString('ar-EG');
    
    // تغيير لون الزر إلى الأخضر مؤقتاً
    if (btn) {
      const originalText = btn.innerHTML;
      btn.classList.add('success');
      btn.innerHTML = '✓ تم التسجيل';
      
      setTimeout(() => {
        btn.classList.remove('success');
        btn.innerHTML = originalText;
      }, 1500); // يعود لطبيعته بعد 1.5 ثانية
    }
    
    showToast('✓ تم تسجيل ' + p.name + ' — المتبقي: ' + data[id]);
  } else {
    showToast('🎉 لا توجد صلوات متبقية!');
  }
}

function undo(id) {
  const p = prayers.find(x => x.id === id);
  data[id] += p.count;
  save();
  document.getElementById('count-' + id).textContent = data[id].toLocaleString('ar-EG');
  showToast('↩ تم التراجع — المتبقي: ' + data[id]);
}

function prayFullDay(btn) {
  let done = 0;
  prayers.forEach(p => {
    if (data[p.id] >= p.count) {
      data[p.id] -= p.count;
      done++;
    }
  });
  save();
  
  // تحديث الأرقام في الشاشة
  prayers.forEach(p => {
    const el = document.getElementById('count-' + p.id);
    if (el) el.textContent = data[p.id].toLocaleString('ar-EG');
  });

  // تأثير أخضر لزر اليوم الكامل
  if (btn && done > 0) {
    const originalText = btn.innerHTML;
    btn.style.background = '#16a34a';
    btn.style.borderColor = '#16a34a';
    btn.style.color = 'white';
    btn.innerHTML = '✓ تم تسجيل اليوم كاملاً';
    
    setTimeout(() => {
      btn.style.background = 'linear-gradient(135deg, #0f766e 0%, #115e59 100%)';
      btn.style.borderColor = '#d4af37';
      btn.style.color = '#d4af37';
      btn.innerHTML = originalText;
    }, 1500);
  }
  
  if (done === prayers.length) showToast('🎉 ما شاء الله! تم تسجيل قضاء يوم كامل');
  else showToast('تم تسجيل ' + done + ' مجموعة (الباقي صفر)');
}

function save() {
  localStorage.setItem('salahData_final', JSON.stringify(data));
}

/* ═══════════ Toast ═══════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

/* ═══════════ التهيئة ═══════════ */
document.addEventListener('DOMContentLoaded', function() {
  render();
});
</script>

</body>
</html>
